# Core Accounting — Docker Compose (Production)
#
# Preferred:
#   ./scripts/install.sh
#
# Manual (after copying .env.example to .env and replacing placeholders):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Project name is core-accounting-prod so volumes stay separate from the
# dev stack in docker-compose.yml when both are used in this directory.

name: core-accounting-prod

services:
  # ── PostgreSQL 15 (Production) ─────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-accounting}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
      POSTGRES_DB: ${DB_NAME:-core_accounting}
    # No host port published — reachable only on the internal network as
    # "db:5432". Avoids collisions with other stacks' Postgres on the host.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-accounting} -d ${DB_NAME:-core_accounting}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Redis 7 (Production) ───────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    # No host port published — reachable only on the internal network as
    # "redis:6379". Avoids collisions with other stacks' Redis on the host.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Backend (FastAPI Production) ────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Compose drops the image CMD when entrypoint is set, so the server
    # command has to be repeated here. The entrypoint runs migrations first.
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - RUN_DB_INIT=1
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-accounting}:${DB_PASSWORD:?required}@db:5432/${DB_NAME:-core_accounting}
      - AI_READONLY_DATABASE_URL=postgresql+asyncpg://${DB_RO_USER:-accounting_ro}:${DB_RO_PASSWORD:?required}@db:5432/${DB_NAME:-core_accounting}
      - REDIS_URL=redis://redis:6379/0
      - DB_RO_USER=${DB_RO_USER:-accounting_ro}
      - DB_RO_PASSWORD=${DB_RO_PASSWORD:?required}
      - DB_NAME=${DB_NAME:-core_accounting}
      - DEBUG=false
      - ENVIRONMENT=production
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/api/v1/health').raise_for_status()"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s

  # ── Celery Worker (Production) ─────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-accounting}:${DB_PASSWORD:?required}@db:5432/${DB_NAME:-core_accounting}
      - AI_READONLY_DATABASE_URL=postgresql+asyncpg://${DB_RO_USER:-accounting_ro}:${DB_RO_PASSWORD:?required}@db:5432/${DB_NAME:-core_accounting}
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=false
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A app.tasks:celery_app worker --loglevel=warning --concurrency=4
    # The API image healthcheck probes port 8000. This process is a worker.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks:celery_app inspect ping -t 10 | grep -q pong"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Nginx: static UI + API reverse proxy ───────────────
  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  redisdata:
  uploads:
