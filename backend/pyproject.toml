[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-accounting"
version = "0.1.0"
description = "Core Accounting System Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.9",
    "langchain-deepseek>=1.1.0",
    "httpx>=0.27.0",
    "socksio>=1.0.0",
    "sqlparse>=0.5.0",
    "structlog>=24.0.0",
    "openpyxl>=3.1.5",
    "alibabacloud-ocr-api20210707>=3.1.3",
    "alibabacloud-tea-openapi>=0.4.5",
    "alibabacloud-tea-util>=0.3.15",
    "alibabacloud-credentials>=1.0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.22.1",
]

[tool.setuptools.packages.find]
where = ["."]
