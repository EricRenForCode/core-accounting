# Core Accounting — Docker Compose (Development)
# Usage:
#   docker compose up -d             # Start all services
#   docker compose up -d db redis    # Start infrastructure only
#   docker compose down -v           # Teardown (removes volumes)

version: "3.9"

services:
  # ── PostgreSQL 15 ──────────────────────────────────────
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: accounting
      POSTGRES_DB: core_accounting
    # No host port published — reachable only on the internal network as
    # "db:5432". Avoids collisions with other stacks' Postgres on the host.
    # Need host access (DB GUI)? Uncomment and pick a free port:
    #   ports:
    #     - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting -d core_accounting"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis 7 ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    # No host port published — reachable only on the internal network as
    # "redis:6379". Avoids collisions with other stacks' Redis on the host.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend (FastAPI) ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  # ── Frontend (Vite dev server) ─────────────────────────
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: pnpm dev --host 0.0.0.0
    profiles:
      - full

  # ── Celery Worker ──────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.tasks worker
      --loglevel=info
      --concurrency=2
    profiles:
      - full
      - worker

volumes:
  pgdata:
  redisdata:
